<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Raifen Discovery{% endblock %}</title>
  <style>
    :root {
      --navy: #001233; --cian: #2CC4DC; --azul: #348AB7; --violeta: #4C448D;
      --bg: #f6f8fa; --card: #ffffff; --texto: #16263b; --muted: #64748b; --borde: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: var(--bg);
      color: var(--texto); margin: 0; padding: 0;
    }
    header.top {
      background: var(--navy); color: #fff; padding: 14px 24px; display: flex;
      align-items: center; justify-content: space-between;
    }
    header.top .brand { font-weight: 700; letter-spacing: .3px; }
    header.top .brand span { color: var(--cian); }
    main { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
    .card {
      background: var(--card); border: 1px solid var(--borde); border-radius: 12px;
      padding: 20px; margin-bottom: 16px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--borde); font-size: 14px; }
    th { color: var(--muted); font-weight: 600; }
    .btn {
      display: inline-block; background: var(--azul); color: #fff; padding: 8px 16px;
      border-radius: 8px; text-decoration: none; font-weight: 600; border: none;
      cursor: pointer; font-size: 14px;
    }
    .btn.secundario { background: transparent; color: var(--azul); border: 1px solid var(--azul); }
    .btn.violeta { background: var(--violeta); }
    .pill {
      display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px;
      font-weight: 600; background: #eef2ff; color: var(--violeta);
    }
    .pill.pendiente { background: #f1f5f9; color: var(--muted); }
    .pill.en_progreso { background: #e0f2fe; color: var(--azul); }
    .pill.completado { background: #dcfce7; color: #15803d; }
    .pill.borrador { background: #f1f5f9; color: var(--muted); }
    .pill.confirmada { background: #dcfce7; color: #15803d; }
    .pill.entregada_oscar, .pill.validada_consume { background: #eef2ff; color: var(--violeta); }
    .progreso-barra { background: #e2e8f0; border-radius: 999px; height: 8px; overflow: hidden; width: 100%; }
    .progreso-barra > div { background: var(--cian); height: 100%; }
    .muted { color: var(--muted); font-size: 13px; }
    a { color: var(--azul); }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">{{ brand_name }} <span>Discovery</span></div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
