<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>
  <title>{% block title %}Raifen Discovery{% endblock %}</title>
  <style>
    :root {
      --cyan: #2CC4DC; --mint: #348AB7; --violeta: #4C448D;
      --earth-400: #8291A8; --earth-500: #A9B7CC; --earth-600: #4A5C74; --earth-700: #2E3D52; --earth-800: #001233;
      --success: #34C77B;
      --font-heading: 'Sora', sans-serif; --font-body: 'DM Sans', -apple-system, sans-serif;

      /* Lienzo de fondo: SIEMPRE oscuro con los degradados de marca, no cambia con el
         toggle -- lo unico que cambia entre claro/oscuro es el color de las tarjetas
         que flotan encima (pedido explicito: el modo claro plano se veia sin fuerza). */
      --canvas: #000A1F;

      --card: #ffffff; --card-inset: #eef1f6; --texto: var(--earth-800); --muted: #5C6B84; --borde: #e2e8f0;
    }
    :root[data-theme="dark"] {
      --card: #0A2647; --card-inset: #071B3D; --texto: #F1F5F9; --muted: var(--earth-500); --borde: #1E3A5F;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --card: #0A2647; --card-inset: #071B3D; --texto: #F1F5F9; --muted: var(--earth-500); --borde: #1E3A5F;
      }
    }
    /* El header NUNCA cambia con el tema -- siempre claro, siempre logo a color (pedido
       explicito: es donde mas se ve el logo, no tiene que competir con el toggle). Solo
       el contenido (body/cards) responde al claro/oscuro. */
    :root {
      --header-bg: #EAF9FC; --header-texto: #001233; --header-borde: #2CC4DC;
      --header-link-hover: rgba(44, 196, 220, 0.15);
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body); color: var(--texto); margin: 0; padding: 0;
      background-color: var(--canvas);
      background-image:
        radial-gradient(ellipse 60% 50% at 8% 0%, rgba(76, 68, 141, 0.38), transparent 60%),
        radial-gradient(ellipse 55% 45% at 95% 15%, rgba(44, 196, 220, 0.22), transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 100%, rgba(52, 138, 183, 0.16), transparent 65%);
      background-attachment: fixed;
      background-repeat: no-repeat;
      transition: color .2s;
    }
    h1, h2, h3 { font-family: var(--font-heading); }
    header.top {
      background: var(--header-bg); border-bottom: 2px solid var(--header-borde);
      color: var(--header-texto); padding: 12px 24px; display: flex; align-items: center;
      justify-content: space-between; flex-wrap: wrap; gap: 10px; position: sticky; top: 0; z-index: 10;
    }
    header.top .marca { display: flex; align-items: center; gap: 14px; text-decoration: none; }
    header.top img.logo { height: 42px; display: block; }
    header.top .separador { width: 1px; height: 26px; background: currentColor; opacity: .2; }
    header.top .titulo-proyecto { font-family: var(--font-heading); font-weight: 600; font-size: 14.5px; opacity: .85; }
    nav.top-nav { display: flex; gap: 6px; align-items: center; }
    nav.top-nav a {
      color: var(--header-texto); text-decoration: none; font-size: 14px; font-weight: 600;
      padding: 9px 14px; border-radius: 8px; transition: background .15s;
    }
    nav.top-nav a:hover { background: var(--header-link-hover); }
    nav.top-nav a.cta { background: var(--cyan); color: var(--earth-800); }
    nav.top-nav a.cta:hover { background: #5DD8EA; }
    #toggle-tema {
      background: var(--header-link-hover); border: 1px solid currentColor; opacity: .9; color: var(--header-texto);
      border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 15px;
    }
    main { max-width: 1600px; margin: 0 auto; padding: 24px 28px 64px; }
    .card {
      background: var(--card); border: 1px solid var(--borde); border-radius: 12px;
      padding: 20px; margin-bottom: 16px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
    .grid-3 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: stretch; }
    @media (max-width: 960px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    /* Tarjetas emparejadas: mismo alto siempre, scroll interno si el contenido crece
       en vez de estirar la tarjeta y desparejar todo. */
    .grid-2 > .card, .grid-3 > .card {
      display: flex; flex-direction: column; max-height: 420px; overflow-y: auto;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--borde); font-size: 14px; }
    th { color: var(--muted); font-weight: 600; }
    .btn {
      display: inline-block; background: var(--mint); color: #fff; padding: 8px 16px;
      border-radius: 8px; text-decoration: none; font-weight: 600; border: none;
      cursor: pointer; font-size: 14px; font-family: var(--font-body);
    }
    .btn.secundario { background: transparent; color: var(--mint); border: 1px solid var(--mint); }
    .btn.violeta { background: var(--violeta); }
    .btn.cyan { background: var(--cyan); color: var(--earth-800); }
    .pill {
      display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px;
      font-weight: 600; background: #eef2ff; color: var(--violeta);
    }
    .pill.pendiente { background: rgba(130,145,168,.15); color: var(--muted); }
    .pill.en_progreso { background: rgba(44,196,220,.15); color: var(--mint); }
    .pill.completado { background: rgba(52,199,123,.15); color: var(--success); }
    .pill.borrador { background: rgba(130,145,168,.15); color: var(--muted); }
    .pill.confirmada { background: rgba(52,199,123,.15); color: var(--success); }
    .pill.entregada_oscar, .pill.validada_consume { background: rgba(76,68,141,.15); color: var(--violeta); }
    .progreso-barra { background: var(--borde); border-radius: 999px; height: 8px; overflow: hidden; width: 100%; }
    .progreso-barra > div { background: var(--cyan); height: 100%; }
    .muted { color: var(--muted); font-size: 13px; }
    a { color: var(--mint); }
    input, textarea, select {
      font-family: var(--font-body); background: var(--card-inset); color: var(--texto);
      border: 1px solid var(--borde); border-radius: 8px; padding: 8px;
    }
    .stepper { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 0; }
    .stepper .paso {
      flex: 1; min-width: 150px; background: var(--card-inset); border: 1px solid var(--borde);
      border-radius: 10px; padding: 12px 14px; font-size: 13.5px;
    }
    .stepper .paso b { display: block; font-family: var(--font-heading); color: var(--mint); margin-bottom: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <header class="top">
    <a class="marca" href="/">
      <img class="logo" src="/static/raifen-logo.png" alt="Raifen">
      <div class="separador"></div>
      <span class="titulo-proyecto">Discovery{% if proyecto %} — {{ proyecto.cliente }}{% endif %}</span>
    </a>
    <nav class="top-nav">
      {% block nav %}{% endblock %}
      <button id="toggle-tema" title="Cambiar tema claro/oscuro">🌙</button>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    (function () {
      const root = document.documentElement;
      const btn = document.getElementById("toggle-tema");
      const guardado = localStorage.getItem("discovery-tema");
      if (guardado) root.setAttribute("data-theme", guardado);
      function actual() {
        return root.getAttribute("data-theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      }
      function actualizarIcono() { btn.textContent = actual() === "dark" ? "☀️" : "🌙"; }
      actualizarIcono();
      btn.addEventListener("click", () => {
        const nuevo = actual() === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", nuevo);
        localStorage.setItem("discovery-tema", nuevo);
        actualizarIcono();
      });
    })();
  </script>
</body>
</html>
